<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ezee Cycles — Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* LOGIN */

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.1);
        }

        .login-box h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            color: #d32f2f;
            margin-top: 15px;
            font-size: 14px;
        }

        /* DASHBOARD */

        #dashboard {
            display: none;
        }

        .topbar {
            background: #111;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            margin: 0;
        }

        .logout-btn {
            width: auto;
            padding: 9px 16px;
            background: #333;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .stat-card h3 {
            margin: 0 0 8px;
            color: #666;
            font-size: 14px;
        }

        .stat-card strong {
            font-size: 28px;
        }

        .enquiries {
            background: white;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }

        .enquiries h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th,
        td {
            padding: 13px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            font-size: 13px;
            color: #666;
        }

        .status-select {
            width: auto;
            padding: 7px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        @media (max-width: 700px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 15px;
            }

            .dashboard-container {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage" class="login-container">

    <div class="login-box">

        <h1>Ezee Cycles</h1>

        <p>Admin Dashboard</p>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

    <div class="topbar">

        <h2>Ezee Cycles Admin</h2>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <div class="dashboard-container">

        <div class="stats">

            <div class="stat-card">
                <h3>Total Enquiries</h3>
                <strong id="totalCount">0</strong>
            </div>

            <div class="stat-card">
                <h3>New</h3>
                <strong id="newCount">0</strong>
            </div>

            <div class="stat-card">
                <h3>Converted</h3>
                <strong id="convertedCount">0</strong>
            </div>

        </div>


        <div class="enquiries">

            <h2>Customer Enquiries</h2>

            <table>

                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>City</th>
                        <th>Model</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="enquiriesBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONFIG
    // ==========================================

    const SUPABASE_URL = 'https://jzsnkwyyawpvkavbdlka.supabase.co';

    const SUPABASE_KEY = 'sb_publishable_TiTuNDdlj6W6ifpiNaBYNA_YfE_8TlZ';


    // ==========================================
    // LOGIN
    // ==========================================

    async function login() {

        const email =
            document.getElementById('email').value.trim();

        const password =
            document.getElementById('password').value;

        const error =
            document.getElementById('loginError');


        if (!email || !password) {

            error.textContent =
                'Please enter your email and password.';

            return;
        }


        error.textContent = '';


        try {

            const response = await fetch(
                `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error_description ||
                    data.msg ||
                    'Login failed'
                );

            }


            // Save login session
            localStorage.setItem(
                'ezee_access_token',
                data.access_token
            );

            localStorage.setItem(
                'ezee_refresh_token',
                data.refresh_token
            );


            showDashboard(data.access_token);


        } catch (err) {

            console.error(err);

            error.textContent =
                err.message || 'Login failed.';

        }

    }


    // ==========================================
    // SHOW DASHBOARD
    // ==========================================

    function showDashboard(token) {

        document.getElementById('loginPage').style.display =
            'none';

        document.getElementById('dashboard').style.display =
            'block';

        loadEnquiries(token);

    }


    // ==========================================
    // LOAD ENQUIRIES
    // ==========================================

    async function loadEnquiries(token) {

        try {

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/enquiries?select=*&order=created_at.desc`,
                {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token}`
                    }
                }
            );


            if (!response.ok) {

                throw new Error(
                    await response.text()
                );

            }


            const enquiries =
                await response.json();


            displayEnquiries(enquiries);


        } catch (error) {

            console.error(
                'Could not load enquiries:',
                error
            );

        }

    }


    // ==========================================
    // DISPLAY ENQUIRIES
    // ==========================================

    function displayEnquiries(enquiries) {

        const body =
            document.getElementById('enquiriesBody');


        body.innerHTML = '';


        let newCount = 0;
        let convertedCount = 0;


        enquiries.forEach(enquiry => {

            if (enquiry.status === 'New') {
                newCount++;
            }

            if (enquiry.status === 'Converted') {
                convertedCount++;
            }


            const row =
                document.createElement('tr');


            const date =
                new Date(
                    enquiry.created_at
                ).toLocaleString();


            row.innerHTML = `

                <td>${date}</td>

                <td>${escapeHtml(enquiry.name)}</td>

                <td>
                    <a href="tel:${escapeHtml(enquiry.phone)}">
                        ${escapeHtml(enquiry.phone)}
                    </a>
                </td>

                <td>${escapeHtml(enquiry.city || '')}</td>

                <td>${escapeHtml(enquiry.model || '')}</td>

                <td>

                    <select
                        class="status-select"
                        onchange="updateStatus(${enquiry.id}, this.value)"
                    >

                        <option ${enquiry.status === 'New' ? 'selected' : ''}>
                            New
                        </option>

                        <option ${enquiry.status === 'Contacted' ? 'selected' : ''}>
                            Contacted
                        </option>

                        <option ${enquiry.status === 'Test Ride Scheduled' ? 'selected' : ''}>
                            Test Ride Scheduled
                        </option>

                        <option ${enquiry.status === 'Completed' ? 'selected' : ''}>
                            Completed
                        </option>

                        <option ${enquiry.status === 'Converted' ? 'selected' : ''}>
                            Converted
                        </option>

                    </select>

                </td>

            `;


            body.appendChild(row);

        });


        document.getElementById('totalCount').textContent =
            enquiries.length;

        document.getElementById('newCount').textContent =
            newCount;

        document.getElementById('convertedCount').textContent =
            convertedCount;

    }


    // ==========================================
    // UPDATE STATUS
    // ==========================================

    async function updateStatus(id, status) {

        const token =
            localStorage.getItem(
                'ezee_access_token'
            );


        try {

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/enquiries?id=eq.${id}`,
                {
                    method: 'PATCH',

                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


            if (!response.ok) {

                throw new Error(
                    await response.text()
                );

            }


            loadEnquiries(token);


        } catch (error) {

            console.error(
                'Status update failed:',
                error
            );

            alert(
                'Could not update status.'
            );

        }

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    function logout() {

        localStorage.removeItem(
            'ezee_access_token'
        );

        localStorage.removeItem(
            'ezee_refresh_token'
        );


        document.getElementById('dashboard').style.display =
            'none';

        document.getElementById('loginPage').style.display =
            'flex';

    }


    // ==========================================
    // BASIC HTML ESCAPING
    // ==========================================

    function escapeHtml(value) {

        const div =
            document.createElement('div');

        div.textContent =
            value ?? '';

        return div.innerHTML;

    }


    // ==========================================
    // CHECK EXISTING LOGIN
    // ==========================================

    const savedToken =
        localStorage.getItem(
            'ezee_access_token'
        );


    if (savedToken) {

        showDashboard(savedToken);

    }

</script>

</body>
</html>
